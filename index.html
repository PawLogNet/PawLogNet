var CFG={apiKey:"AIzaSyD3bpwE3MaZ7Rb-J3PbpwA0xtjlMNCjL0I",authDomain:"pawlog-bf697.firebaseapp.com",projectId:"pawlog-bf697",appId:"1:590550072795:web:d374420e0ebd4f9dadfbfe"};
var S={pets:[],recs:[],wts:[],sel:null},FID=null,st,auth,db,unsub;

S.wts=S.wts||[];
try{var th=localStorage.getItem("pawlog_theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
function save(){if(!FID)return;clearTimeout(st);st=setTimeout(function(){db.collection("families").doc(FID).update({state:JSON.stringify(S)}).catch(function(x){alert("Couldn’t sync: "+x.message)})},400)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var EMO={dog:"🐶",cat:"🐱",other:"🐾"};
var COLS=["#8b5a2b","#e67e22","#c0392b","#d6336c","#7048e8","#2b6cb0","#0f8b8d","#2f855a","#4a5568","#111111"];
var CATS=["Vaccination","Deworming","Flea & tick","Vet visit","Medication","Care task","Other"];
var REP=[["0","One-off"],["1","Every month"],["2","Every 2 months"],["3","Every 3 months"],["6","Every 6 months"],["12","Every year"],["c","Custom…"]];
function fg(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?"#111":"#fff"}
function addM(d,m){var x=new Date(d+"T00:00:00");var day=x.getDate();x.setMonth(x.getMonth()+m);if(x.getDate()!==day)x.setDate(0);return iso(x)}
function iso(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
var DPH="";
function av(p){return p.photo?'<img src="'+p.photo+'" alt="">':EMO[p.type]}
function pickPhoto(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=240;var x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240);DPH=c.toDataURL("image/jpeg",.75);document.getElementById("ph").innerHTML='<img src="'+DPH+'" alt="">'};im.src=r.result};r.readAsDataURL(f)}
function humanAge(p){if(!p.dob||p.type=="other")return"";var y=days(today(),p.dob)/365.25;if(y<0)return"";var h=y<1?15*y:y<2?15+9*(y-1):24+(y-2)*(p.type=="dog"?5:4);return Math.round(h)+" years"}
function bday(dob){if(!dob)return"";var t=new Date(today()+"T00:00:00"),b=new Date(dob+"T00:00:00"),n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n.setFullYear(t.getFullYear()+1);var d=Math.round((n-t)/864e5);return d==0?"🎂 Today!":fmt(iso(n))+" · in "+d+" days"}
function wsum(ws){if(!ws.length)return"";var l=ws[ws.length-1].kg,d=ws.length>1?Math.round((l-ws[ws.length-2].kg)*100)/100:0;return'<div style="display:flex;align-items:baseline;gap:10px;margin:0 0 6px"><span style="font-size:32px;font-weight:800;letter-spacing:-1px">'+l+' kg</span>'+(d?'<span class="'+(d>0?"warn":"ok")+'" style="font-weight:700">'+(d>0?"▲ +":"▼ ")+d+' kg</span>':"")+'</div>'}

add("Born",p.dob?fmt(p.dob):"");var ha=humanAge(p);add("In human years",ha?"≈ "+ha:"");add("Next birthday",bday(p.dob));
add("Sex",p.sex&&p.sex!="Unknown"?esc(p.sex):"");add("Spayed / neutered",p.neut&&p.neut!="Unknown"?esc(p.neut):"");add("Microchip",esc(p.chip));
add("Vet",[esc(p.vet),p.vphone?'<a href="tel:'+esc(p.vphone)+'" style="color:inherit">'+esc(p.vphone)+'</a>':""].filter(Boolean).join(" · "));
add("Allergies",esc(p.allergy));add("Insurance",esc(p.ins));add("Notes",esc(p.notes));
return'<div class="card"><h2>ℹ️ About '+esc(p.name)+'</h2>'+(rows.join("")||'<div class="empty">No details yet. Tap Edit details to add them.</div>')+condBlock(p)+'<button class="sec sm" style="margin-top:16px" onclick="editDetails()">Edit details</button></div>'}
function phRow(p){return'<div style="display:flex;align-items:center;gap:14px;margin:10px 0"><div id="ph" style="width:72px;height:72px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:36px;overflow:hidden">'+av(p)+'</div><label style="margin:0;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;color:var(--tx)">Choose photo<input type="file" accept="image/*" onchange="pickPhoto(this)" style="display:none"></label></div>'}
function detF(p,nph){function sel(id,v,o){return'<select id="'+id+'">'+o.map(function(x){return'<option'+(x==v?" selected":"")+'>'+x+'</option>'}).join("")+'</select>'}
return''+(nph?"":phRow(p))+'<div class="grid"><div><label>Sex</label>'+sel("ds",p.sex||"Unknown",["Unknown","Male","Female"])+'</div><div><label>Spayed / neutered</label>'+sel("dn",p.neut||"Unknown",["Unknown","Yes","No"])+'</div></div><label>Microchip number</label><input id="dc" value="'+esc(p.chip)+'"><div class="grid"><div><label>Vet / clinic</label><input id="dv" value="'+esc(p.vet)+'"></div><div><label>Vet phone</label><input id="dp" type="tel" value="'+esc(p.vphone)+'"></div></div><label>Allergies</label><input id="da" value="'+esc(p.allergy)+'"><label>Insurance</label><input id="di" value="'+esc(p.ins)+'"><label>Notes</label><textarea id="dt" rows="2">'+esc(p.notes)+'</textarea>'}

}

var W={};
function wizard(id){var e=id&&S.pets.filter(function(p){return p.id===id})[0];W=e?{id:e.id,step:1,type:e.type,name:e.name,breed:e.breed,dob:e.dob,color:e.color,x:e}:{step:0,type:"",name:"",breed:"",dob:"",color:COLS[0],x:{}};DPH=(e&&e.photo)||"";wstep()}
function wstep(){
  var s=W.step,m=document.getElementById("modal"),h="";
  var bar='<div class="steps">'+[0,1,2,3].map(function(i){return'<i class="'+(i<=s?"on":"")+'"></i>'}).join("")+'</div>';
  if(s==0)h='<h3>What kind of pet?</h3><p class="sub">Choose an animal to get started.</p><div class="pick">'+["dog","cat","other"].map(function(t){return'<button class="'+(W.type==t?"on":"")+'" onclick="W.type=\''+t+'\';wstep()"><span>'+EMO[t]+'</span>'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join("")+'</div>';
  if(s==1)h='<h3>Tell us about them</h3><p class="sub">Add a photo if you like. Only the name is required.</p>'+phRow({type:W.type,photo:DPH})+'<label>Name</label><input id="wn" value="'+esc(W.name)+'" placeholder="e.g. Bella"><div class="grid"><div><label>Breed (optional)</label><input id="wb" value="'+esc(W.breed)+'"></div><div><label>Date of birth</label><input id="wd" type="date" value="'+esc(W.dob)+'"></div></div>';
  if(s==2)h='<h3>Pick a label colour</h3><p class="sub">This colour will represent '+esc(W.name)+' across the app.</p><div class="sw">'+COLS.map(function(c){return'<button style="--c:'+c+'" class="'+(W.color==c?"on":"")+'" onclick="W.color=\''+c+'\';wstep()"></button>'}).join("")+'</div><label>Or choose your own</label><input type="color" value="'+W.color+'" onchange="W.color=this.value;wstep()" style="height:44px;padding:4px"><div class="banner" style="background:'+W.color+';color:'+fg(W.color)+';margin-top:16px"><div class="em">'+EMO[W.type]+'</div><div><h1 style="font-size:22px">'+esc(W.name)+'</h1></div></div>';
  if(s==3)h=wDet();var back=s>0&&!(W.id&&s==1)?'<button class="sec" onclick="wnav(-1)">Back</button>':'<button class="sec" onclick="closeM()"'+(S.pets.length?'':' style="visibility:hidden"')+'>Cancel</button>';
  m.innerHTML='<div class="ov"><div class="modal">'+bar+h+'<div class="foot">'+back+'<button onclick="wnav(1)">'+(s==3?"Finish":"Continue")+'</button></div></div></div>';
}
function wnav(d){
  if(W.step==3){var g=function(i){return document.getElementById(i).value.trim()};W.x={photo:DPH,sex:g("ds"),neut:g("dn"),chip:g("dc"),vet:g("dv"),vphone:g("dp"),allergy:g("da"),ins:g("di"),notes:g("dt")}}
  if(W.step==1){W.name=document.getElementById("wn").value.trim();W.breed=document.getElementById("wb").value.trim();W.dob=document.getElementById("wd").value}
  if(d>0){if(W.step==0&&!W.type)return;if(W.step==1&&!W.name){document.getElementById("wn").focus();return}
    if(W.step==3){var o=Object.assign({},W.x,{id:W.id||uid(),type:W.type,name:W.name,breed:W.breed,dob:W.dob,color:W.color});var i=S.pets.findIndex(function(p){return p.id==o.id});if(i>=0)S.pets[i]=Object.assign({},S.pets[i],o);else S.pets.push(o);S.sel=o.id;save();closeM();render();return}}
  W.step+=d;if(W.id&&W.step<1){closeM();return}wstep();
}
function closeM(){document.getElementById("modal").innerHTML=""}
function recForm(pc,all){
  var p=pet();
  document.getElementById("modal").innerHTML='<div class="ov"><div class="modal"><h3>Add record'+(all?"":" for "+esc(p.name))+'</h3><p class="sub">Vaccines, treatments, medications or vet visits.</p><label>Category</label><select id="rc" onchange="rcChg()">'+CATS.map(function(c){return"<option"+(c===pc?" selected":"")+">"+c+"</option>"}).join("")+'</select><label>Name</label><input id="rt" list="sug" placeholder="e.g. Rabies booster, Bravecto, Apoquel"><datalist id="sug"></datalist><label>Dose (optional)</label><input id="rs" placeholder="e.g. 5 mg, 1 tablet"><label>Supply (optional)</label><div class="grid3"><input id="sl" type="number" min="0" placeholder="Left"><input id="su" type="number" min="1" placeholder="Per dose"><input id="sw" type="number" min="0" placeholder="Warn at"></div><div class="grid"><div><label>Date given</label><input id="rd" type="date" value="'+today()+'"></div><div><label>Repeat</label><select id="rr" onchange="document.getElementById(\'cr\').style.display=this.value==\'c\'?\'grid\':\'none\'">'+REP.map(function(r){return'<option value="'+r[0]+'">'+r[1]+"</option>"}).join("")+'</select></div></div><div id="cr" class="grid" style="display:none"><div><label>Every</label><input id="cn" type="number" min="1" value="1"></div><div><label>Unit</label><select id="cu"><option value="d">Days</option><option value="w">Weeks</option><option value="m">Months</option><option value="y">Years</option></select></div></div><label>Notes (optional)</label><textarea id="rn" rows="2" placeholder="Dose, vet, clinic, cost…"></textarea><label>Attach a photo or file (optional)</label><input id="rf" type="file" accept="image/*,application/pdf">'+pickPets(all)+'<div class="foot"><button class="sec" onclick="closeM()">Cancel</button><button onclick="saveRec()">Save</button></div></div></div>';
  rcChg();
}
var SUG={"Vaccination":["Rabies","DHPP / C5","FVRCP","Bordetella","Leptospirosis"],"Deworming":["Deworming tablet"],"Flea & tick":["Spot-on treatment","Flea & tick tablet"],"Vet visit":["Check-up","Dental clean"],"Medication":[],"Care task":["Nail trim","Grooming","Ear cleaning","Teeth brushing"],"Other":[]};
function rcChg(){var c=document.getElementById("rc").value;document.getElementById("sug").innerHTML=SUG[c].map(function(x){return'<option value="'+x+'">'}).join("");var def={"Deworming":"3","Flea & tick":"3","Vaccination":"12","Care task":"1"}[c];if(def)document.getElementById("rr").value=def}
function saveRec(){
  var t=document.getElementById("rt").value.trim(),d=document.getElementById("rd").value;var rv=document.getElementById("rr").value,rep=0,repd=0;if(rv=="c"){var cn=Math.max(1,parseInt(document.getElementById("cn").value)||1),cu=document.getElementById("cu").value;if(cu=="d")repd=cn;else if(cu=="w")repd=cn*7;else rep=cu=="m"?cn:cn*12}else rep=+rv;
  if(!t){document.getElementById("rt").focus();return}if(!d)return;
  var ids=selPets();if(!ids.length){alert("Pick at least one pet.");return}var NR=[];ids.forEach(function(pid){var nid=uid();NR.push({pet:pid,rec:nid});S.recs.push({id:nid,pet:pid,cat:document.getElementById("rc").value,title:t,date:d,next:repd?addD(d,repd):rep?addM(d,rep):"",rep:rep||0,repd:repd||0,dose:document.getElementById("rs").value.trim(),left:document.getElementById("sl").value,use:document.getElementById("su").value,low:document.getElementById("sw").value,notes:document.getElementById("rn").value.trim()})});var fl=document.getElementById("rf").files[0];if(fl){attach(fl,NR,t,document.getElementById("rc").value).then(function(){save();closeM();render()});return}
  save();closeM();render();
}
function attn(){var out=[];S.pets.forEach(function(p){var s={};S.recs.filter(function(r){return r.pet===p.id}).sort(function(a,b){return b.date<a.date?-1:1}).forEach(function(r){var k=r.cat+"|"+r.title.toLowerCase();if(s[k])return;s[k]=1;if(r.next){var d=days(r.next,today());if(d<=7)out.push({n:p.name,t:r.title,d:d})}})});S.pets.forEach(function(p){latestBy(p.id,"Medication").forEach(function(r){if(low(r))out.push({n:p.name,t:r.title+" running low ("+r.left+" left)",d:-.5,lo:1})})});out.sort(function(a,b){return a.d-b.d});return out.length?'<div class="card" style="border-color:var(--bad)"><h2 class="bad">⚠️ Needs attention</h2>'+out.map(function(o){return'<div class="row"><b>'+esc(o.n)+' · '+esc(o.t)+'</b><span class="badge '+(o.d<0?"bad":"warn")+'">'+(o.lo?"Low supply":o.d<0?Math.abs(o.d)+"d overdue":o.d==0?"Today":"in "+o.d+"d")+'</span></div>'}).join("")+'</div>':""}
function given(id){var r=S.recs.filter(function(x){return x.id===id})[0];if(!r)return;var t=today();S.recs.push({id:uid(),pet:r.pet,cat:r.cat,title:r.title,date:t,next:r.repd?addD(t,+r.repd):r.rep?addM(t,+r.rep):"",rep:r.rep||0,repd:r.repd||0,dose:r.dose||"",left:hasL(r)?Math.max(0,+r.left-(+r.use||1)):"",use:r.use||"",low:r.low||"",notes:""});save();render()}
function addW(){var k=parseFloat(document.getElementById("wk").value);if(!(k>0))return;S.wts.push({id:uid(),pet:pet().id,date:today(),kg:Math.round(k*100)/100});save();render()}
function delW(id){S.wts=S.wts.filter(function(w){return w.id!==id});save();render()}
function spark(ws,c){if(ws.length<2)return"";var v=ws.map(function(w){return w.kg}),mn=Math.min.apply(0,v),mx=Math.max.apply(0,v),r=(mx-mn)||1;var pts=v.map(function(y,i){return(10+i*280/(v.length-1)).toFixed(1)+","+(70-(y-mn)/r*55).toFixed(1)}).join(" ");return'<svg viewBox="0 0 300 80" style="width:100%;height:80px"><polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>'}
function theme(){var r=document.documentElement,d=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=d=="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pawlog_theme",n)}catch(e){}}
function resetAll(){if(confirm("Erase all pets and records for everyone in this family? This can't be undone.")){S={pets:[],recs:[],wts:[],sel:null};save();render();wizard()}}
function init(){
  if(typeof firebase==="undefined"){document.getElementById("app").innerHTML='<div class="hero"><h1>Can’t load Firebase</h1><p>This preview blocks it. Open the app from your Netlify link instead.</p></div>';return}
  if(!CFG.apiKey||CFG.apiKey.indexOf("PASTE")==0){document.getElementById("app").innerHTML='<div class="hero"><h1>Setup needed</h1><p>Paste your Firebase settings into the CFG block at the top of this file.</p></div>';return}
  firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(function(u){if(unsub){unsub();unsub=null}FID=null;closeM();if(u)loadFam(u);else authScreen()});
}
function authScreen(mode){
  var up=mode=="up";
  document.getElementById("app").innerHTML='<div class="hero" style="padding-top:40px"><div style="font-size:64px">🐾</div><h1>PawLog</h1><p>'+(up?"Create your account":"Sign in to your family’s pet records")+'</p><div style="max-width:320px;margin:0 auto;text-align:left"><label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="'+(up?"new-password":"current-password")+'" placeholder="At least 6 characters"><p id="ae" class="bad" style="min-height:20px;margin:6px 0"></p><button style="width:100%" onclick="doAuth(\''+(up?"up":"in")+'\')">'+(up?"Create account":"Sign in")+'</button><p class="note"><a href="#" style="color:inherit" onclick="authScreen(\''+(up?"in":"up")+'\');return false">'+(up?"Have an account? Sign in":"New here? Create an account")+'</a>'+(up?"":' · <a href="#" style="color:inherit" onclick="forgot();return false">Forgot password?</a>')+'</p></div></div>';
}
function doAuth(m){
  var e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value,er=document.getElementById("ae");er.textContent="";
  (m=="up"?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(function(x){er.textContent=x.message.replace("Firebase: ","")});
}
function forgot(){
  var e=document.getElementById("em").value.trim(),er=document.getElementById("ae");
  if(!e){er.textContent="Enter your email first.";return}
  auth.sendPasswordResetEmail(e).then(function(){er.className="ok";er.textContent="Reset link sent. Check your inbox."}).catch(function(x){er.textContent=x.message.replace("Firebase: ","")});
}
function loadFam(u){
  db.collection("users").doc(u.uid).get().then(function(d){var f=d.exists&&d.data().familyId;if(f)openFam(f);else famScreen()}).catch(function(x){document.getElementById("app").innerHTML='<div class="empty">Couldn’t load: '+esc(x.message)+'</div>'});
}
function famScreen(){
  document.getElementById("app").innerHTML='<div class="hero" style="padding-top:40px"><div style="font-size:64px">👪</div><h1>Your family</h1><p>Create a family space, or join one with a code from a family member.</p><div style="max-width:320px;margin:0 auto;text-align:left"><button style="width:100%" onclick="mkFam()">Create a family</button><label style="text-align:center;margin:18px 0 4px">or join with a code</label><input id="fc" placeholder="Family code" style="text-transform:uppercase"><p id="ae" class="bad" style="min-height:20px;margin:6px 0"></p><button class="sec" style="width:100%" onclick="joinFam()">Join family</button><p class="note"><a href="#" style="color:inherit" onclick="auth.signOut();return false">Sign out</a></p></div></div>';
}
function code(){var c="ABCDEFGHJKMNPQRSTUVWXYZ23456789",o="";for(var i=0;i<8;i++)o+=c[Math.floor(Math.random()*c.length)];return o}
function mkFam(){
  var u=auth.currentUser,id=code();
  db.collection("families").doc(id).set({members:[u.uid],state:JSON.stringify({pets:[],recs:[],wts:[]})}).then(function(){return db.collection("users").doc(u.uid).set({familyId:id})}).then(function(){openFam(id)}).catch(function(x){document.getElementById("ae").textContent=x.message});
}
function joinFam(){
  var u=auth.currentUser,id=document.getElementById("fc").value.trim().toUpperCase(),er=document.getElementById("ae");
  if(!id)return;
  db.collection("families").doc(id).update({members:firebase.firestore.FieldValue.arrayUnion(u.uid)}).then(function(){return db.collection("users").doc(u.uid).set({familyId:id})}).then(function(){openFam(id)}).catch(function(){er.textContent="Couldn’t find that family code."});
}
function openFam(id){
  FID=id;
  unsub=db.collection("families").doc(id).onSnapshot(function(d){
    if(!d.exists||d.metadata.hasPendingWrites)return;
    var sel=S.sel;try{S=JSON.parse(d.data().state)}catch(e){S={}}
    S.pets=S.pets||[];S.recs=S.recs||[];S.wts=S.wts||[];S.sel=sel;
    render();if(!document.getElementById("modal").innerHTML){if(!a2Seen()&&!a2Inst())a2hs(!S.pets.length);else if(!S.pets.length)wizard()}
  },function(x){document.getElementById("app").innerHTML='<div class="empty">Sync error: '+esc(x.message)+'</div>'});
}
function famInfo(){
  document.getElementById("modal").innerHTML='<div class="ov"><div class="modal"><h3>Your family</h3><p class="sub">Share this code so family members can join after creating their own account.</p><div class="banner" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd);justify-content:center"><h1 style="letter-spacing:4px">'+esc(FID)+'</h1></div><p class="sub">Signed in as '+esc(auth.currentUser.email)+'</p><div class="foot"><button class="sec" onclick="closeM()">Close</button><button onclick="closeM();auth.signOut()">Sign out</button></div></div></div>';
}
function delRec(id){if(confirm("Delete this record?")){S.recs=S.recs.filter(function(r){return r.id!==id});save();render()}}
function delPet(){var p=pet();if(confirm("Remove "+p.name+" and all their records?")){S.pets=S.pets.filter(function(x){return x.id!==p.id});S.recs=S.recs.filter(function(r){return r.pet!==p.id});S.meals=(S.meals||[]).filter(function(m){return m.pet!==p.id});S.sx=(S.sx||[]).filter(function(m){return m.pet!==p.id});S.docs=(S.docs||[]).filter(function(m){return m.pet!==p.id});S.conds=(S.conds||[]).filter(function(m){return m.pet!==p.id});S.sel=null;save();render();if(!S.pets.length)wizard()}}
init();
</script>
</body>
